    properties:
      content:
        type: string
      sort_order:
        type: integer
      title:
        type: string
    type: object
  github_com_n0m-d_DVAPI_internal_domain.UpdateUserRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
    type: object
  internal_handler.emailRequest:
    properties:
      email:
        description: ',email binding removed for SMTP CRLF Injection'
        example: user@example.com
        type: string
    required:
    - email
    type: object
  internal_handler.loginRequest:
    properties:
      email:
        example: test@example.com
        type: string
      password:
        example: password
        type: string
    required:
    - email
    - password
    type: object
  internal_handler.passwordChangeRequest:
    properties:
      confirm_password:
        example: newpassword123
        type: string
      current_password:
        example: oldpassword
        type: string
      password:
        example: newpassword123
        minLength: 8
        type: string
    required:
    - confirm_password
    - current_password
    - password
    type: object
  internal_handler.registerRequest:
    properties:
      confirm_password:
        example: password123
        type: string
      email:
        example: newuser@example.com
        type: string
      full_name:
        example: Jane Doe
        type: string
      password:
        example: password123
        minLength: 8
        type: string
    required:
    - confirm_password
    - email
    - full_name
    - password
    type: object
  internal_handler.resetPasswordRequest:
    properties:
      confirm_password:
        example: newpassword123
        type: string
      email:
        example: user@example.com
        type: string
      password:
        example: newpassword123
        minLength: 8
        type: string
    required:
    - confirm_password
    - email
    - password
    type: object
  internal_handler.verifyOTPRequest:
    properties:
      email:
        example: user@example.com
        type: string
      otp:
        example: "123456"
        type: string
    required:
    - email
    - otp
    type: object
