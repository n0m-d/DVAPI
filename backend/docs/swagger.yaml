    required:
    - grade
    type: object
  github_com_n0m-d_DVAPI_internal_domain.LessonProgressRequest:
    properties:
      completed:
        type: boolean
    type: object
  github_com_n0m-d_DVAPI_internal_domain.UpdateAnnouncementRequest:
    properties:
      content:
        type: string
      status:
        enum:
        - draft
        - published
        type: string
      title:
        type: string
    type: object
  github_com_n0m-d_DVAPI_internal_domain.UpdateAssignmentRequest:
    properties:
      description:
        type: string
      due_date:
        type: string
      status:
        enum:
        - draft
        - published
        - closed
        type: string
      title:
        type: string
    type: object
