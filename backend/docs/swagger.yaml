        type: string
      due_date:
        type: string
      status:
        type: string
      title:
        type: string
    required:
    - course_id
    - description
    - due_date
    - status
    - title
    type: object
  github_com_n0m-d_DVAPI_internal_domain.CreateCourseRequest:
    properties:
      description:
