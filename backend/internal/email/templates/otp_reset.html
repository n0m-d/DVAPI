<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body
    style="font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px"
  >
    <div
      style="
        max-width: 480px;
        margin: auto;
        background: #fff;
        border-radius: 8px;
        padding: 32px;
      "
    >
      <h2 style="color: #222">Password Reset Request</h2>

      <p>Hi {{.Name}},</p>

      <p>Use the OTP below to reset your password.</p>

      <div
        style="
          font-size: 28px;
          font-weight: bold;
          letter-spacing: 4px;
          background: #f0f0f0;
          padding: 16px;
          text-align: center;
          border-radius: 6px;
          margin: 20px 0;
        "
      >
        {{.OTP}}
      </div>

      {{if .CustomMsg}}
      <div
        style="
          margin: 20px 0;
          padding: 16px;
          background: #eef6ff;
          border-left: 4px solid #2563eb;
          border-radius: 4px;
          color: #333;
        "
      >
        {{.CustomMsg}}
      </div>
      {{end}}

      <p>If you didn't request this, you can safely ignore this email.</p>
    </div>
  </body>
</html>
